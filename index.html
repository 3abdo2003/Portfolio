<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,600,500,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-stack: 'Cabinet Grotesk', 'Cabinet Grotesk Variable', system-ui, -apple-system, Segoe UI, Roboto,
        'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji';
      --primary: #2563eb;
      /* Blue 600 */
      --secondary: #3b82f6;
      /* Blue 500 */
    }

    html,
    body,
    #root {
      font-family: var(--font-stack);
      scroll-behavior: smooth;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    /* Animated Gradient Text */
    .text-gradient {
      background: linear-gradient(to right, var(--primary), var(--secondary), #60a5fa);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: gradient-x 4s linear infinite;
    }

    @keyframes gradient-x {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
